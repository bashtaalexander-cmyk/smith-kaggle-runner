name: SMITH Kaggle starter preflight
on:
  push:
    paths:
      - '.github/workflows/smith-starter-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install 'kaggle>=1.8,<2'
      - name: Fetch official starter and inspect launch options
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p starter
          kaggle --version
          kaggle kernels push --help | tee starter/push-help.txt
          kaggle kernels pull ryanholbrook/getting-started-gemma-4-developer-agent -m -p starter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smith-starter-preflight
          path: starter/
