name: SMITH holdout ID manifest
on:
  push:
    paths:
      - '.github/workflows/smith-holdout-retrieve.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency: smith-holdout-retrieve
jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python -m pip install kaggle==1.8.4
      - name: Run a private copy of the official starter on Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p starter evidence
          KERNEL="alexbashta/smith-eligible-id-manifest-45339878297"
          for attempt in $(seq 1 20); do
            status="$(kaggle kernels status "$KERNEL" 2>&1)"
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$status" | tee -a evidence/status.log
            case "${status,,}" in
              *complete*) kaggle kernels output "$KERNEL" -p evidence/output; exit 0 ;;
              *error*|*cancel*) kaggle kernels output "$KERNEL" -p evidence/output || true; exit 1 ;;
            esac
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smith-holdout-retrieve-evidence
          path: evidence/
