name: SMITH exploratory paired evaluation
on:
  push:
    paths:
      - '.github/workflows/smith-exploratory-pair-31b.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency: smith-exploratory-pair-31b
jobs:
  starter:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arm: [baseline, edit-args]
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - run: python -m pip install kaggle==1.8.4
      - name: Run a private copy of the official starter on Kaggle
        env:
          SMITH_ARM: ${{ matrix.arm }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p starter evidence
          kaggle kernels pull ryanholbrook/getting-started-gemma-4-developer-agent -m -p starter
          export KERNEL="alexbashta/smith-exploratory-pair-31b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SMITH_ARM}"
          python - <<'PY'
          import json, os
          from pathlib import Path

          meta_path = Path("starter/kernel-metadata.json")
          meta = json.loads(meta_path.read_text())
          notebook_path = meta_path.parent / meta["code_file"]
          notebook = json.loads(notebook_path.read_text())
          old = "MODEL_NAME = 'gemma-4-12b-it-qat-w4a16-ct'"
          new = "MODEL_NAME = 'gemma-4-31b-it-qat-w4a16-ct'"
          count = 0
          for cell in notebook["cells"]:
              source = cell["source"]
              source = "".join(source) if isinstance(source, list) else source
              count += source.count(old) + source.count(new)
              cell["source"] = source.replace(old, new)
          assert count == 1, "Unexpected starter model selection"
          assert meta["enable_gpu"] and not meta["enable_internet"]
          assert meta["machine_shape"] == "NvidiaL4"
          assert any("31b" in model for model in meta["model_sources"])
          candidate = "from pathlib import Path\n\nAGENT_DIR = WORKING_DIR / 'smith_candidate_31b'\nAGENT_DIR.mkdir()\n(AGENT_DIR / 'agent.yaml').write_text(\"\"\"name: smith_candidate_31b\nmodel: gemma-4-31b-it-qat-w4a16-ct\ninstruction: !include system.md\ntools:\n  - run_command\n  - read_file\n  - edit_file\n  - write_file\n  - submit_patch\n\"\"\")\n(AGENT_DIR / 'system.md').write_text(\"\"\"Fix the reported software behavior in the local repository. Use the issue's own symbols and paths to locate the implementation. Search tracked code once with git grep, then read short relevant ranges. If the report is underspecified, inspect the nearest existing implementation or automation before choosing a minimal change. Once the mechanism is clear, edit immediately. Use workspace-relative paths. Review git diff --check and the actual diff. Run at most one narrow existing regression test if feasible. Submit promptly after verification. Leave test fixtures, generated files and scratch files out of the patch. Keep tool output short.\n\"\"\")\n(AGENT_DIR / 'eval_config.yaml').write_text(\"\"\"evaluation:\n  timeout_seconds: 180\n  verification_timeout_seconds: 180\n  max_tool_calls: 24\n  max_time_minutes: 30\n\"\"\")" if os.environ["SMITH_ARM"] == "baseline" else "from pathlib import Path\n\nAGENT_DIR = WORKING_DIR / 'smith_edit_args_31b'\nAGENT_DIR.mkdir()\n(AGENT_DIR / 'agent.yaml').write_text(\"\"\"name: smith_edit_args_31b\nmodel: gemma-4-31b-it-qat-w4a16-ct\ninstruction: !include system.md\ntools:\n  - run_command\n  - read_file\n  - edit_file\n  - write_file\n  - submit_patch\n\"\"\")\n(AGENT_DIR / 'system.md').write_text(\"\"\"Fix the reported software behavior in the local repository. Use the issue's own symbols and paths to locate the implementation. Search tracked code once with git grep, then read short relevant ranges. If the report is underspecified, inspect the nearest existing implementation or automation before choosing a minimal change. Once the mechanism is clear, edit immediately. Use workspace-relative paths. For edit_file send a valid JSON object with exactly filepath, old_string and new_string. Copy the old text exactly from a short read, set both strings explicitly, and verify JSON escaping for quotes and backslashes before calling. If the call reports missing arguments, rebuild the entire object from the tool schema before retrying once. Review git diff --check and the actual diff. Run at most one narrow existing regression test if feasible. Submit promptly after verification. Leave test fixtures, generated files and scratch files out of the patch. Keep tool output short.\n\"\"\")\n(AGENT_DIR / 'eval_config.yaml').write_text(\"\"\"evaluation:\n  timeout_seconds: 180\n  verification_timeout_seconds: 180\n  max_tool_calls: 24\n  max_time_minutes: 30\n\"\"\")"
          model_cell = next(c for c in notebook["cells"] if new in c["source"] and "from swegemma.models import load_tasks" in c["source"])
          model_cell["source"] += "\n" + candidate
          eval_cell = next(c for c in notebook["cells"] if "SAMPLE_TASKS = tasks[:2]" in c["source"])
          eval_cell["source"] = eval_cell["source"].replace("SAMPLE_TASKS = tasks[:2]", "by_id = {task.instance_id: task for task in tasks}\nSAMPLE_TASKS = [by_id[key] for key in ('rich_4079', 'rich_4077', 'fastapi_14786', 'fastapi_15030', 'requests_7427', 'requests_6589')]")
          eval_cell["source"] = eval_cell["source"].replace("display(submission_df)", "submission_df.to_json(WORKING_DIR / 'predictions.jsonl', orient='records', lines=True)\ndisplay(submission_df)")
          evidence_setup = "import hashlib, zipfile, json, os\nassert eval_config.submission_dir == AGENT_DIR\ncandidate_zip = Path(shutil.make_archive(str(WORKING_DIR / 'candidate-before-eval'), 'zip', root_dir=AGENT_DIR))\ncandidate_sha = hashlib.sha256(candidate_zip.read_bytes()).hexdigest()\nconfig_sha = hashlib.sha256((AGENT_DIR / 'eval_config.yaml').read_bytes()).hexdigest()\nprint('Active candidate', AGENT_DIR, candidate_sha, config_sha, 'max_tool_calls', max_tool_calls)\n"
          checkpoint = "    row = dict(id=task.instance_id, resolved=result.resolved, test_exit_code=result.test_exit_code, duration_seconds=result.duration_seconds, tool_calls=result.tool_calls, prediction=patch, candidate_sha256=candidate_sha, eval_config_sha256=config_sha, trace_path=f'results/traces/trace_{task.instance_id}.json', run_id=SMITH_RUN_ID)\n    journal = WORKING_DIR / 'official-verdicts.jsonl'\n    pending = journal.with_suffix('.tmp')\n    with pending.open('w', encoding='utf-8') as out:\n        if journal.exists():\n            out.write(journal.read_text(encoding='utf-8'))\n        out.write(json.dumps(row) + '\\n')\n        out.flush()\n        os.fsync(out.fileno())\n    pending.replace(journal)\n"
          eval_cell["source"] = "SMITH_RUN_ID = " + repr(os.environ["GITHUB_RUN_ID"]) + "\n" + eval_cell["source"]
          eval_cell["source"] = eval_cell["source"].replace("evaluator = Evaluator(eval_config)", evidence_setup + "evaluator = Evaluator(eval_config)").replace("    predictions.append(", checkpoint + "    predictions.append(")
          compile(eval_cell["source"], "evaluator cell", "exec")
          notebook_path.write_text(json.dumps(notebook))
          meta.pop("id_no", None)
          meta.update(id=os.environ["KERNEL"], title=os.environ["KERNEL"].split("/")[1].replace("-", " ").title(), is_private=True)
          meta_path.write_text(json.dumps(meta))
          print("Kaggle notebook:", "https://www.kaggle.com/code/" + meta["id"])
          PY
          kaggle kernels push -p starter --accelerator NvidiaL4 -t 3000 2>&1 | tee evidence/push.log
          for attempt in $(seq 1 104); do
            status="$(kaggle kernels status "$KERNEL" 2>&1)"
            printf '%s %s\n' "$(date -u +%FT%TZ)" "$status" | tee -a evidence/status.log
            case "${status,,}" in
              *complete*) kaggle kernels output "$KERNEL" -p evidence/output; exit 0 ;;
              *error*|*cancel*) kaggle kernels output "$KERNEL" -p evidence/output || true; exit 1 ;;
            esac
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smith-exploratory-pair-31b-${{ matrix.arm }}-evidence
          path: evidence/
