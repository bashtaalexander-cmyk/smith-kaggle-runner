name: SMITH historical ID inventory
on:
  push:
    paths:
      - '.github/workflows/smith-history-id-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: python -m pip install kaggle==1.8.4
      - name: Read Kaggle notebook and dataset metadata
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p notebook evidence
          timeout 50 kaggle kernels pull alexbashta/getting-started-gemma-4-developer-agent -m -p notebook > evidence/pull.log 2>&1 || true
          timeout 50 kaggle datasets files alexbashta/gemma-agent-test > evidence/dataset-files.txt 2>&1 || true
          python - <<'PY'
          import re
          from pathlib import Path
          pattern = r"\b(?:fastapi|requests|rich|httpx)_\d+\b"
          for p in sorted(Path("notebook").glob("*.ipynb")):
              ids = sorted(set(re.findall(pattern, p.read_text(encoding="utf-8"))))
              Path("evidence/notebook-ids.txt").write_text("".join(i + "\n" for i in ids))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smith-history-id-inventory
          path: evidence/
