
name: Check Kaggle API

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kaggle CLI
        run: pip install "kaggle>=1.8,<2"

      - name: Check Kaggle connection
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || {
            echo "KAGGLE_API_TOKEN is missing"
            exit 1
          }
          kaggle kernels list --mine
